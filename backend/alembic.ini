# Alembic Configuration
[alembic]
script_location = alembic
prepend_sys_path = .
version_locations = %(script_location)s/versions
sqlalchemy.url = postgresql+asyncpg://localai:password@localhost:5432/localai

[post_write_hooks]
hooks = format
format.type = console_scripts
format.entrypoint = black
format.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S